# Secrets for the LOCAL dev cluster (Task 7.3).
# These are the same PUBLIC development defaults as .env.example – NOT real secrets.
# Real secrets never go in Git. The Gemini key is created from the command line:
#   kubectl create secret generic swiftdrop-gemini -n swiftdrop --from-literal=GEMINI_API_KEY=<key>
# For any shared/prod cluster, create swiftdrop-secrets the same way with new values.
apiVersion: v1
kind: Secret
metadata:
  name: swiftdrop-secrets
  namespace: swiftdrop
type: Opaque
stringData:
  POSTGRES_PASSWORD: postgrespassword
  RABBITMQ_USER: guest
  RABBITMQ_PASS: guest
  JWT_SECRET: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
