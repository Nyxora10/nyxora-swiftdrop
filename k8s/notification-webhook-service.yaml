# notification-webhook-service – Deployment + Service (Task 7.3)
# Probes check the TCP port: this service has no Actuator yet (/actuator/health).
# Switch to httpGet /actuator/health once spring-boot-starter-actuator is added.
apiVersion: v1
kind: Service
metadata:
  name: notification-webhook-service
  namespace: swiftdrop
  labels:
    app: notification-webhook-service
spec:
  selector:
    app: notification-webhook-service
  ports:
    - name: http
      port: 8083
      targetPort: 8083
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-webhook-service
  namespace: swiftdrop
  labels:
    app: notification-webhook-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-webhook-service
  template:
    metadata:
      labels:
        app: notification-webhook-service
    spec:
      # Don't inject Kubernetes "service link" env vars (e.g. PARCEL_SERVICE_PORT=tcp://...),
      # they clash with the apps' own PARCEL_SERVICE_PORT etc. Services use DNS names instead.
      enableServiceLinks: false
      containers:
        - name: notification-webhook-service
          image: swiftdrop/notification-webhook-service:local
          imagePullPolicy: IfNotPresent # images are built locally, not pulled from a registry
          ports:
            - containerPort: 8083
          envFrom:
            - configMapRef:
                name: swiftdrop-config
            - secretRef:
                name: swiftdrop-secrets
          # Slow JVM start: allow up to 3 minutes before liveness checks begin
          startupProbe:
            tcpSocket:
                port: 8083
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            tcpSocket:
                port: 8083
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
                port: 8083
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              cpu: "1"
              memory: 768Mi
