# ai-assistant-service – Deployment + Service (Task 7.3)
# Probes check the TCP port: this service has no Actuator yet (/actuator/health).
# Switch to httpGet /actuator/health once spring-boot-starter-actuator is added.
apiVersion: v1
kind: Service
metadata:
  name: ai-assistant-service
  namespace: swiftdrop
  labels:
    app: ai-assistant-service
spec:
  selector:
    app: ai-assistant-service
  ports:
    - name: http
      port: 8084
      targetPort: 8084
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-assistant-service
  namespace: swiftdrop
  labels:
    app: ai-assistant-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-assistant-service
  template:
    metadata:
      labels:
        app: ai-assistant-service
    spec:
      # Don't inject Kubernetes "service link" env vars (e.g. PARCEL_SERVICE_PORT=tcp://...),
      # they clash with the apps' own PARCEL_SERVICE_PORT etc. Services use DNS names instead.
      enableServiceLinks: false
      containers:
        - name: ai-assistant-service
          image: swiftdrop/ai-assistant-service:local
          imagePullPolicy: IfNotPresent # images are built locally, not pulled from a registry
          ports:
            - containerPort: 8084
          envFrom:
            - configMapRef:
                name: swiftdrop-config
            - secretRef:
                name: swiftdrop-secrets
            # Gemini key: created from the command line, never in Git (optional so the pod is still created)
            - secretRef:
                name: swiftdrop-gemini
                optional: true
          # Slow JVM start: allow up to 3 minutes before liveness checks begin
          startupProbe:
            tcpSocket:
                port: 8084
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            tcpSocket:
                port: 8084
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
                port: 8084
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              cpu: "1"
              memory: 768Mi
