# parcel-service – Deployment + Service (Task 7.3)
# Probes check the TCP port: this service has no Actuator yet (/actuator/health).
# Switch to httpGet /actuator/health once spring-boot-starter-actuator is added.
apiVersion: v1
kind: Service
metadata:
  name: parcel-service
  namespace: swiftdrop
  labels:
    app: parcel-service
spec:
  selector:
    app: parcel-service
  ports:
    - name: http
      port: 8082
      targetPort: 8082
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: parcel-service
  namespace: swiftdrop
  labels:
    app: parcel-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: parcel-service
  template:
    metadata:
      labels:
        app: parcel-service
    spec:
      # Don't inject Kubernetes "service link" env vars (e.g. PARCEL_SERVICE_PORT=tcp://...),
      # they clash with the apps' own PARCEL_SERVICE_PORT etc. Services use DNS names instead.
      enableServiceLinks: false
      containers:
        - name: parcel-service
          image: swiftdrop/parcel-service:local
          imagePullPolicy: IfNotPresent # images are built locally, not pulled from a registry
          ports:
            - containerPort: 8082
          envFrom:
            - configMapRef:
                name: swiftdrop-config
            - secretRef:
                name: swiftdrop-secrets
          # Slow JVM start: allow up to 3 minutes before liveness checks begin
          startupProbe:
            tcpSocket:
                port: 8082
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            tcpSocket:
                port: 8082
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
                port: 8082
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              cpu: "1"
              memory: 768Mi
          volumeMounts:
            - name: uploads
              mountPath: /app/uploads
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: swiftdrop-uploads
---
# Shared uploads volume (delivery proofs), like swiftdrop-uploads in docker-compose
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: swiftdrop-uploads
  namespace: swiftdrop
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
