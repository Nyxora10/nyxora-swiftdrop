server:
  port: 0

spring:
  application:
    name: notification-webhook-service
  datasource:
    url: jdbc:h2:mem:notification_test_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ''
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    show-sql: false
  mail:
    host: localhost
    port: 2525
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false
  rabbitmq:
    listener:
      simple:
        auto-startup: false

app:
  notification:
    from-email: test@swiftdrop.lk
    sms:
      mock-enabled: true
  rabbitmq:
    exchange: swiftdrop.events.topic
    notification-queue: notification.parcel.events
    parcel-routing-key: parcel.#

logging:
  level:
    root: WARN
    com.nyxora.swiftdrop: DEBUG

