spring.application.name=ai-assistant-service
server.port=${SERVER_PORT:8084}

# Health monitoring & Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# Google Gemini AI Configuration
gemini.api.key=${GEMINI_API_KEY:}
# Gemini Configuration
gemini.api.key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-3.5-flash-lite}
gemini.api.url=${GEMINI_API_URL:https://generativelanguage.googleapis.com/v1beta}

# Spring AI - Google Gemini
spring.ai.google.genai.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.chat.options.model=${GEMINI_MODEL}
spring.ai.google.genai.chat.options.temperature=0.3

# Downstream Service URLs for AI Assistant Tools
services.gateway.url=${GATEWAY_URL:http://localhost:8080}
services.auth.url=${AUTH_SERVICE_URL:http://localhost:8081}
services.parcel.url=${PARCEL_SERVICE_URL:http://localhost:8082}
services.notification.url=${NOTIFICATION_SERVICE_URL:http://localhost:8083}

# JWT Secret (for inter-service authorization verification)
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}

# Spring AI Model Context Protocol (MCP) Server
spring.ai.mcp.server.name=swiftdrop-ai-assistant
spring.ai.mcp.server.version=1.0.0
spring.ai.mcp.server.type=SYNC
spring.ai.mcp.server.protocol=STREAMABLE
