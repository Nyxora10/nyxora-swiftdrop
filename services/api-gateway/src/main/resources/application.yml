server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowed-origins:
              - "http://localhost:3000"
              - "http://127.0.0.1:3000"
            allowed-methods:
              - "GET"
              - "POST"
              - "PUT"
              - "DELETE"
              - "PATCH"
              - "OPTIONS"
            allowed-headers:
              - "*"
            allow-credentials: true
            max-age: 3600
      routes:
        # Route 1: Auth Service (Port 8081)
        - id: auth-service-route
          uri: ${AUTH_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/auth/**

        # Route 2: Parcel Service (Port 8082 - Prepared for Phase 6)
        - id: parcel-service-route
          uri: ${PARCEL_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/v1/parcels/**, /api/v1/pricing/**, /api/v1/zones/**, /api/v1/couriers/**

        # Route 3: Notification Webhook Service (Port 8083 - Prepared)
        - id: notification-service-route
          uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/v1/notifications/**, /api/v1/webhooks/**

app:
  jwt:
    secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    '[org.springframework.cloud.gateway]': INFO
    '[com.nyxora.swiftdrop]': DEBUG

