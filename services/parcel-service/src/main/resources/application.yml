server:
  port: ${PARCEL_SERVICE_PORT:8082}

spring:
  application:
    name: parcel-service

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5433}/parcel_db
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgrespassword}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      "[hibernate.format_sql]": true

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASS:guest}
    publisher-confirm-type: correlated
    publisher-returns: true

# SpringDoc OpenAPI & Swagger UI
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: method
    tags-sorter: alpha
    try-it-out-enabled: true
    display-request-duration: true

logging:
  level:
    root: INFO
    "[com.nyxora.swiftdrop]": DEBUG
    "[org.springframework.security]": INFO

# Delivery Proof Storage (Member 6: Task 1.8)
app:
  security:
    # Identity headers (X-User-*, X-Merchant-Id) are trusted only with this X-Gateway-Secret.
    # Must match api-gateway's GATEWAY_SHARED_SECRET. Override outside local development.
    gateway-shared-secret: ${GATEWAY_SHARED_SECRET:dev-gateway-shared-secret-change-me}
  storage:
    type: ${STORAGE_TYPE:s3}
    proofs-dir: ${PROOFS_DIR:uploads/proofs}
    s3:
      bucket-name: ${AWS_S3_BUCKET_NAME:swiftdrop-delivery-proofs}
      region: ${AWS_REGION:ap-southeast-2}
      access-key: ${AWS_ACCESS_KEY_ID:}
      secret-key: ${AWS_SECRET_ACCESS_KEY:}
