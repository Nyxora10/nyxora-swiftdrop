spring:
  datasource:
    url: jdbc:h2:mem:parcel_test_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      "[hibernate.format_sql]": true
  h2:
    console:
      enabled: false

