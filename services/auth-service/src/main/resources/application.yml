server:
  port: 8081

spring:
  application:
    name: auth-service

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/auth_db
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgrespassword}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      "[hibernate.format_sql]": true

# SpringDoc OpenAPI & Swagger UI Configuration
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: method
    tags-sorter: alpha
    try-it-out-enabled: true
    display-request-duration: true

# Custom Application Security, JWT & Social OAuth Properties
app:
  jwt:
    # 256-bit default secret key for development (override via JWT_SECRET in production)
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    access-token-expiration-ms: 900000       # 15 minutes (in milliseconds)
    refresh-token-expiration-ms: 604800000   # 7 days (in milliseconds)
  google:
    client-id: ${GOOGLE_CLIENT_ID:mock-google-client-id.apps.googleusercontent.com}
  apple:
    client-id: ${APPLE_CLIENT_ID:mock-apple-client-id}
  facebook:
    app-id: ${FACEBOOK_APP_ID:mock-facebook-app-id}
    app-secret: ${FACEBOOK_APP_SECRET:mock-facebook-app-secret}

logging:
  level:
    root: INFO
    "[com.nyxora.swiftdrop]": DEBUG
    "[org.springframework.security]": INFO
