{{- if .Values.secrets.create }}
# Local dev secret (public defaults from values). Disabled in values-prod.yaml.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secrets.name }}
  labels:
    {{- include "swiftdrop.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ .Values.secrets.POSTGRES_PASSWORD | quote }}
  RABBITMQ_USER: {{ .Values.secrets.RABBITMQ_USER | quote }}
  RABBITMQ_PASS: {{ .Values.secrets.RABBITMQ_PASS | quote }}
  JWT_SECRET: {{ .Values.secrets.JWT_SECRET | quote }}
{{- end }}
