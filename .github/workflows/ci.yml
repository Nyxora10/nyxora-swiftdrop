name: SwiftDrop CI Pipeline

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  build-shared-libraries:
    name: Build & Test Shared Libraries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build and Test security-common
        run: mvn clean install -B -f shared/security-common/pom.xml

  build-and-test:
    name: Build & Test (${{ matrix.service }})
    needs: build-shared-libraries
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - auth-service
          - api-gateway
          - parcel-service
      fail-fast: false

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: swiftdrop_it_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Install Shared Libraries into Runner Cache
        run: mvn clean install -DskipTests -B -f shared/security-common/pom.xml

      - name: Run Hermetic Unit and Integration Tests
        run: mvn verify -B -f services/${{ matrix.service }}/pom.xml

  api-tests:
    name: API Regression Tests (Postman/Newman)
    needs: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Same docker-compose stack as local development, with the seed-data.sql accounts.
      # ai-assistant-service (needs a Gemini key) and the frontend are not needed for API tests.
      - name: Build and start the stack
        run: docker compose up -d --build postgres rabbitmq auth-service parcel-service notification-webhook-service api-gateway

      - name: Wait until the services are ready
        run: |
          for i in $(seq 1 60); do
            login=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:8080/api/v1/auth/login \
              -H 'Content-Type: application/json' \
              -d '{"email":"admin@swiftdrop.lk","password":"Admin@SwiftDrop2026!"}' || true)
            parcel=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8082/ || true)
            notification=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8083/ || true)
            echo "attempt $i: login=$login parcel=$parcel notification=$notification"
            if [ "$login" = "200" ] && [ "$parcel" != "000" ] && [ "$notification" != "000" ]; then
              echo "Stack is ready"; exit 0
            fi
            sleep 5
          done
          echo "Stack did not become ready in time"; exit 1

      - name: Run Postman collection with Newman
        run: |
          mkdir -p newman
          npx --yes newman@6.2.1 run tests/postman/swiftdrop-collection.json \
            --env-var baseUrl=http://localhost:8080 \
            --reporters cli,junit \
            --reporter-junit-export newman/results.xml

      - name: Upload Newman results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman-results
          path: newman/results.xml

      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --tail 150

      - name: Stop the stack
        if: always()
        run: docker compose down -v
